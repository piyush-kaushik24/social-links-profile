<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social links profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <article class="social-links-profile">
        <img class="profile-image" src="./images/avatar-jessica.jpeg" alt="" />
        <div class="profile-details">
          <h1 class="profile-name">Jessica Randall</h1>
          <p class="profile-address">London, United Kingdom</p>
        </div>

        <p class="profile-description">
          "Front-end developer and avid reader."
        </p>
        <nav class="profile-social-links" aria-label="Social links.">
          <a href="#">GitHub</a>
          <a href="#">Frontend Mentor</a>
          <a href="#">LinkedIn</a>
          <a href="#">Twitter</a>
          <a href="#">Instagram</a>
        </nav>
      </article>
    </main>
  </body>
</html>
